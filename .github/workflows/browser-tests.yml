name: Browser tests

# Playwright tests of web/shop.html. A failed test saves a screenshot, a video and a
# trace (a step-by-step replay), so there's something to see next to it in Flaw Patrol.
on:
  push:
  # About every hour, 30 minutes after the Tests workflow. On these runs one test is
  # now and then flaky: its first try fails and the retry passes.
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: How the run goes
        type: choice
        default: nothing fails (normal run)
        options:
          - nothing fails (normal run)
          - random (like the hourly runs)
          - everything passes

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    env:
      SIMULATE: ${{ github.event_name == 'schedule' && 'random' || inputs.simulate || 'nothing fails (normal run)' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Writes results/results.xml and results/results.json, plus results/files with a
      # screenshot, video and trace for each failed try. One test (applies a discount
      # code) fails on purpose, except on "everything passes".
      - name: Run browser tests
        run: |
          if [ "$SIMULATE" = "everything passes" ]; then export ALL_PASS=1; fi
          if [ "$SIMULATE" = "random (like the hourly runs)" ]; then export SIM_RANDOM=1; fi
          npm run test:browser

      - name: Save results for Flaw Patrol
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
