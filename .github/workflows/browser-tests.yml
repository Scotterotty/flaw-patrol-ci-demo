name: Browser tests

# Playwright tests of web/shop.html. A failed test saves a screenshot, a video and a
# trace (a step-by-step replay), so there's something to see next to it in Flaw Patrol.
on:
  push:
  # About every hour, 30 minutes after the Tests workflow, with a random outcome
  # (see ci/pick-outcome.js): mostly green, now and then a bad change brings the shop's
  # discount bug back for a few hours, about 1 run in 7 a bad deploy breaks 1 or 2
  # tests for just that run, and one test is flaky.
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: How the run goes
        type: choice
        default: nothing fails (normal run)
        options:
          - nothing fails (normal run)
          - random (like the hourly runs)
          - everything passes

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    env:
      SIMULATE: ${{ github.event_name == 'schedule' && 'random' || inputs.simulate || 'nothing fails (normal run)' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Also picks how this run goes (see ci/pick-outcome.js). On random runs it now and
      # then fails the way a flaky npm registry would.
      - name: Install
        run: |
          node ci/pick-outcome.js browser > outcome.env
          cat outcome.env >> "$GITHUB_ENV"
          if grep -q SIM_INSTALL_FAILS outcome.env; then
            echo "npm error code ETIMEDOUT"
            echo "npm error network request to https://registry.npmjs.org/@playwright%2ftest failed, reason: read ETIMEDOUT"
            echo "::error::npm ci failed: request to registry.npmjs.org timed out (ETIMEDOUT)"
            exit 1
          fi
          npm ci
          npx playwright install --with-deps chromium

      # Writes results/results.xml and results/results.json, plus results/files with a
      # screenshot, video and trace for each failed try. On push and "nothing fails", one
      # test (applies a discount code) fails on purpose.
      - name: Run browser tests
        run: npm run test:browser

      - name: Save results for Flaw Patrol
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results-${{ github.run_number }}
          path: results/
          if-no-files-found: warn
          retention-days: 30
